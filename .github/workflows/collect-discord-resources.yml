name: Collect approved Discord resources

on:
  schedule:
    - cron: "41 3 */3 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-approved-discord-resources
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect approved public resource links
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: python scripts/collect_discord_resources.py

      - name: Commit audited collection queue
        shell: bash
        run: |
          git config user.name "FIRSTHub data bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/discord-resources.json data/discord-state.json
          if git diff --cached --quiet; then
            echo "No approved Discord resource changes to commit."
            exit 0
          fi
          git commit -m "chore(data): collect approved Discord resources"
          git pull --rebase origin main
          git push origin HEAD:main
