name: Refresh public team resources

on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-public-team-resources
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install public metadata and CAD preview collectors
        run: |
          python -m pip install --disable-pip-version-check yt-dlp playwright Pillow
          python -m playwright install --with-deps chromium

      - name: Refresh FRC YouTube team resources
        run: python scripts/collect_frc_youtube.py --limit-per-query 50

      - name: Refresh FTC public records and YouTube team resources
        run: |
          python scripts/collect_ftc_demo.py --years 2023 2024 2025 --chief-pages 4 --merge
          python scripts/collect_ftc_youtube.py --limit-per-query 50
          python scripts/filter_ftc_demo.py --output data/ftc-demo-v6.json --check-links
          cp data/ftc-demo-v6.json data/ftc-demo.json

      - name: Add new public Onshape CAD previews
        run: python scripts/collect_cad_previews.py --workers 2 --limit 30

      - name: Commit changed public data
        shell: bash
        run: |
          git config user.name "FIRSTHub data bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/js/data.js assets/cad-previews index.html data/frc-youtube.json data/ftc-youtube.json data/ftc-demo-raw.json data/ftc-demo.json data/ftc-demo-v6.json
          if git diff --cached --quiet; then
            echo "No public-data changes to commit."
            exit 0
          fi
          git commit -m "chore(data): refresh FRC and FTC public resources"
          git pull --rebase origin main
          git push origin HEAD:main
